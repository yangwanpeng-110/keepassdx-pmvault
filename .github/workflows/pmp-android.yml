name: PmVault Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/pmp-android.yml'
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/pmp-android.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK pre-installed on the GitHub runner (AGP downloads
      # the required platform-36 / build-tools automatically); just accept licenses.
      - name: Accept Android SDK licenses
        run: |
          SDKMGR=""
          for c in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          echo "ANDROID_HOME=$ANDROID_HOME  sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/licenses" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build libre debug APK
        run: ./gradlew :app:assembleLibreDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/libre/debug/app-libre-debug.apk PmVault-android-debug.apk
          sha256sum PmVault-android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PmVault-android-debug
          path: PmVault-android-debug.apk
          if-no-files-found: error
