name: PmVault Android (APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/src/main/java/com/kunzisoft/keepass/pmp/**'
      - 'app/src/main/java/com/kunzisoft/keepass/timeout/**'
      - 'app/src/main/java/com/kunzisoft/keepass/activities/MainCredentialActivity.kt'
      - 'app/build.gradle.kts'
      - '.github/workflows/pmp-android.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build libre debug APK
        run: ./gradlew :app:assembleLibreDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/libre/debug/app-libre-debug.apk PmVault-android-debug.apk
          sha256sum PmVault-android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PmVault-android-debug
          path: PmVault-android-debug.apk
          if-no-files-found: error
